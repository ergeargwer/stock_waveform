[server]
headless = true
# Codespaces / 容器需綁定所有介面；本機亦相容
address = "0.0.0.0"
port = 8501
# 經 GitHub Codespaces 轉發埠時需關閉，否則預覽頁會卡住
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4e9af1"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2e"
textColor = "#e0e6f0"
font = "sans serif"
